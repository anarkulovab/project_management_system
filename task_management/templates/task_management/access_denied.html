<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ запрещён</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0A0F14; --bg-surface: #141B22; --primary-base: #2C3E50;
            --role-member: #9B59B6; --warning: #F39C12;
            --text-primary: #FFFFFF; --text-main: #E0E4E8; --text-secondary: #9AA4B0; --text-muted: #7F8C8D;
        }
        body { background: var(--bg-deep); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: var(--bg-surface); border: 1px solid #2a3a4a; border-radius: 10px; text-align: center; padding: 40px; max-width: 500px; }
        .icon { font-size: 4rem; margin-bottom: 20px; }
        .btn-back { border: 1px solid #2a3a4a; color: var(--text-secondary); text-decoration: none; padding: 8px 20px; border-radius: 6px; display: inline-block; margin-top: 20px; }
        .btn-back:hover { background: var(--role-member); border-color: var(--role-member); color: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔒</div>
        <h3 style="color: var(--text-primary);">Доступ запрещён</h3>
        <p style="color: var(--text-secondary);">{{ message }}</p>
        <p style="color: var(--text-muted);">
            Задача: <strong>{{ task.title }}</strong><br>
            Исполнитель: {{ task.assigned_to }}<br>
            Автор: {{ task.author }}
        </p>
        <a href="javascript:history.back()" class="btn-back">← Вернуться назад</a>
    </div>
</body>
</html>
