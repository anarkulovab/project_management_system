{% extends 'task_management/base.html' %}
{% load static %}

{% block title %}Доступ запрещён | Projector{% endblock %}
{% block page_title %}Доступ запрещён{% endblock %}

{% block extra_head %}
<style>
    .denied-card {
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 60px 20px;
        max-width: 500px;
        margin: 40px auto;
        box-shadow: var(--shadow);
    }
    .denied-card h2 {
        font-size: 20px;
        color: var(--text-heading);
        margin-bottom: 12px;
    }
    .denied-card p {
        color: var(--text-secondary);
        font-size: 14px;
        margin-bottom: 20px;
    }
</style>
{% endblock %}

{% block content %}
<div class="denied-card">
    <h2>Доступ запрещён</h2>
    <p>{{ message }}</p>
    <a href="javascript:history.back()" class="btn btn-outline">Вернуться назад</a>
</div>
{% endblock %}
